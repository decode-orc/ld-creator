# ld-creator project for the NTSC round trip (plan Tasks 7.1 and 7.4;
# docs-tech/user/ntsc-round-trip-metrics.md): the ideal disc, CAV, outer
# radius. The round-trip projects differ only in their stage blocks; every
# key not shown takes its ideal default.

project:
  name: NtscRoundTripCavOuter
  version: "1.0"
  description: Ideal NTSC CAV disc ending at the 145 mm outer radius

input:
  video_path: "{output}/round_trip.cvbs"

disc_cutter:
  format: cav
  # 100 tracks of 1.6667 um end at 144.99997 mm, inside the 145 mm limit of
  # IEC 60857 §4.11.
  start_radius_mm: 144.8333
  track_pitch_um: 1.6667

output:
  rf_path: "{output}/cav_outer.s16"

